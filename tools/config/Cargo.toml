[package]
name = "uqrl-world"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "../../src/native/world.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
gltf = { version = "1.4", default-features = false, features = ["names", "extensions"] }
wasm-bindgen = "=0.2.129"
serde_json = "1"

[[bin]]
name = "bake"
path = "../../src/native/bake.rs"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
