name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --allow-git=root --no-audit --no-fund
      - name: Run quality gate
        run: npm run ci:quality
      - name: Build production app
        run: npm run build
      - name: Run Cypress component tests
        run: npm run test:component
      - name: Run Cypress E2E against preview
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/rsbuild-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat /tmp/rsbuild-preview.log
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null 2>&1; then
              npm run test:e2e -- --config baseUrl=http://127.0.0.1:4173
              exit 0
            fi
            sleep 1
          done

          cat /tmp/rsbuild-preview.log
          exit 1
      - name: Upload Cypress failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-failure
          path: |
            test-results/cypress/screenshots
            test-results/cypress/videos
          if-no-files-found: ignore
          retention-days: 7
