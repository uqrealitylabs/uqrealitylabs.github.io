name: CI

on:
  pull_request:
  push:
    branches: [main, 2027-fix]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Set up Rust WASM tools
        run: |
          rustup component add rustfmt clippy
          npm run setup:rust
      - name: Run quality gate
        run: npm run ci:quality

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Set up Rust WASM tools
        run: |
          rustup component add rustfmt clippy
          npm run setup:rust
      - name: Build and check budgets
        run: npm run ci:build
      - name: Add build summary
        run: |
          set -euo pipefail
          if [ -f out/artifacts/build.md ]; then
            cat out/artifacts/build.md >> "$GITHUB_STEP_SUMMARY"
          fi
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Set up Rust WASM tools
        run: |
          rustup component add rustfmt clippy
          npm run setup:rust
      - name: Build production app
        run: npm run build
      - name: Run Cypress E2E against preview
        run: |
          set -euo pipefail
          mkdir -p out/artifacts
          npm run preview -- --host 127.0.0.1 --port 4173 > out/artifacts/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat out/artifacts/preview.log
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null 2>&1; then
              npm run test:e2e -- --config baseUrl=http://127.0.0.1:4173
              exit 0
            fi
            sleep 1
          done

          cat out/artifacts/preview.log
          exit 1
      - name: Upload Cypress failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypress-tests-failure
          path: |
            out/cypress/screenshots
            out/cypress/videos
          if-no-files-found: ignore
          retention-days: 7
